<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#3a1f8a">
<title>Chuyên đề: Quản lý thời gian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#3a1f8a; --bg2:#2b1569; --ink:#21124f; --soft:rgba(255,255,255,.75); --faint:rgba(255,255,255,.45);
         --c0:#e5484d; --c1:#3e7bfa; --c2:#e8a317; --c3:#26a65b; --sun:#ffd23f; --alarm:#ff4d5e; --ok:#26a65b;
         --shadow:0 5px 0 rgba(0,0,0,.25); --font:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;
         --spring:cubic-bezier(.3,1.5,.5,1); --ease:cubic-bezier(.2,.8,.2,1); }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{background:var(--bg);color:#fff;font-family:var(--font);user-select:none;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  #app{position:relative;min-height:100dvh;display:flex;flex-direction:column;padding:14px 16px 20px;max-width:520px;margin:0 auto}
  .num{font-variant-numeric:tabular-nums}

  [class*="a-"]{animation-duration:.55s;animation-timing-function:var(--spring);animation-fill-mode:both;animation-delay:var(--d,0ms)}
  .a-pop{animation-name:pop} .a-up{animation-name:up} .a-fade{animation-name:fade;animation-timing-function:ease} .a-drop{animation-name:drop}
  @keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
  @keyframes up{from{opacity:0;transform:translateY(36px) scale(.94)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes drop{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}

  /* Đồng hồ mờ ở nền */
  .bgclock{position:fixed;right:-120px;top:-120px;width:300px;height:300px;border-radius:50%;border:5px solid rgba(255,255,255,.07);pointer-events:none}
  .bgclock::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:120px;margin-left:-2.5px;margin-top:-120px;border-radius:5px;background:rgba(255,255,255,.08);transform-origin:50% 100%;animation:spin 30s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .top{position:relative;display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:30px}
  .brand{font-weight:800;font-size:16px;line-height:1.2}
  .sp{flex:1}
  .tag{font-size:15px;font-weight:700;color:var(--ink);background:#fff;padding:1px 12px;border-radius:99px;white-space:nowrap}
  .center{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px}

  /* Đồng hồ báo thức nhỏ (vào chơi, chờ, mở đầu câu) */
  .alarm{position:relative;width:150px;height:150px;margin-bottom:8px}
  .alarm .bell{position:absolute;top:-4px;width:44px;height:30px;border-radius:44px 44px 6px 6px;background:var(--sun);box-shadow:0 3px 0 rgba(0,0,0,.25)}
  .alarm .bell.l{left:6px;transform:rotate(-32deg)} .alarm .bell.r{right:6px;transform:rotate(32deg)}
  .alarm .face{position:absolute;inset:10px;border-radius:50%;background:#fff;box-shadow:0 0 0 7px var(--c0),0 8px 0 7px rgba(0,0,0,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink)}
  .alarm .face::before{content:"";position:absolute;inset:8px;border-radius:50%;background:repeating-conic-gradient(var(--ink) 0 1.6deg,transparent 1.6deg 30deg);
     -webkit-mask:radial-gradient(circle,transparent 84%,#000 85%);mask:radial-gradient(circle,transparent 84%,#000 85%);opacity:.5}
  .alarm .hand{position:absolute;left:50%;top:50%;width:5px;height:46px;margin-left:-2.5px;margin-top:-46px;border-radius:5px;background:var(--c0);transform-origin:50% 100%;animation:spin 4s linear infinite}
  .alarm .hand.m{height:34px;width:6px;margin-left:-3px;margin-top:-34px;background:var(--ink);animation-duration:40s}
  .alarm .dot{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--ink)}
  .alarm.ringing{animation:ring 1.2s ease-in-out infinite}
  @keyframes ring{0%,40%,100%{transform:none}5%,15%,25%{transform:rotate(-8deg)}10%,20%,30%{transform:rotate(8deg)}}

  .join h1,.state h1{font-size:30px;font-weight:800;line-height:1.15}
  .join p,.state p{color:var(--soft);font-size:17px;font-weight:600;line-height:1.4}
  .join .field{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:6px}
  input{width:100%;padding:13px 16px;border-radius:14px;border:0;background:#fff;color:var(--ink);font-family:inherit;font-size:22px;font-weight:700;text-align:center;outline:none;box-shadow:var(--shadow);transition:box-shadow .2s}
  input:focus{box-shadow:0 0 0 4px var(--sun),var(--shadow)}
  input::placeholder{color:#9b92c4}
  .btn{width:100%;padding:13px;border:0;border-radius:14px;background:var(--sun);color:var(--ink);font-family:inherit;font-size:22px;font-weight:800;box-shadow:var(--shadow);
       display:flex;align-items:center;justify-content:center;gap:10px;transition:background .25s,color .25s,transform .12s,box-shadow .12s}
  .btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
  .btn:disabled{background:rgba(255,255,255,.14);color:var(--faint);box-shadow:none}
  .btn.sent{background:var(--ok);color:#fff;box-shadow:var(--shadow);animation:pop .45s var(--spring)}
  .btn.ready{animation:nudge .5s var(--spring)}
  @keyframes nudge{40%{transform:scale(1.04)}}
  .btn svg{width:22px;height:22px}
  .chip{display:inline-block;padding:2px 16px;border-radius:99px;background:var(--sun);color:var(--ink);font-weight:800;font-size:18px}

  /* Màn mở đầu câu */
  .intro{position:fixed;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
         animation:introOut 2.4s ease both;animation-delay:var(--d,0ms);pointer-events:none}
  @keyframes introOut{0%{opacity:0}8%{opacity:1}85%{opacity:1}100%{opacity:0;visibility:hidden}}
  .intro .alarm{width:190px;height:190px;animation:introRing 2.4s ease both;animation-delay:var(--d,0ms)}
  @keyframes introRing{0%{transform:scale(.3) rotate(-20deg);opacity:0}14%{transform:scale(1.08);opacity:1}18%,26%,34%{transform:rotate(-8deg)}22%,30%,38%{transform:rotate(8deg)}44%,100%{transform:none}}
  .intro .hand{height:58px;margin-top:-58px;animation:sweep 1.1s var(--ease) both;animation-delay:calc(var(--d,0ms) + 250ms)}
  @keyframes sweep{from{transform:rotate(0)}to{transform:rotate(360deg);opacity:0}}
  .intro .lbl{font-size:20px;font-weight:700;line-height:1;opacity:.75;animation:fade .3s ease both;animation-delay:calc(var(--d,0ms) + 1000ms)}
  .intro .big{font-size:84px;font-weight:800;line-height:.95;animation:pop .6s var(--spring) both;animation-delay:calc(var(--d,0ms) + 1100ms)}
  .intro .kind{font-size:22px;font-weight:800;color:var(--ink);background:#fff;padding:1px 22px;border-radius:99px;box-shadow:var(--shadow);animation:pop .5s var(--spring) both;animation-delay:calc(var(--d,0ms) + 1300ms)}

  /* Câu hỏi */
  .qhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .rule{flex:1;font-size:14px;font-weight:700;color:var(--ink);background:var(--sun);padding:3px 12px;border-radius:12px;line-height:1.3}
  .mini{--p:1;position:relative;flex:none;width:58px;height:58px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px var(--c1),0 4px 0 4px rgba(0,0,0,.22)}
  .mini .pie{position:absolute;inset:5px;border-radius:50%;background:conic-gradient(rgba(33,18,79,.08) calc((1 - var(--p)) * 360deg),var(--sun) 0)}
  .mini span{position:absolute;inset:14px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink);font-weight:800;font-size:19px}
  .mini.low{box-shadow:0 0 0 4px var(--alarm),0 4px 0 4px rgba(0,0,0,.22);animation:shake .5s ease-in-out infinite}
  .mini.low .pie{background:conic-gradient(rgba(33,18,79,.08) calc((1 - var(--p)) * 360deg),var(--alarm) 0)}
  .mini.low span{color:var(--alarm)}
  @keyframes shake{0%,100%{transform:none}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
  .prompt{background:#fff;color:var(--ink);border-radius:16px;padding:13px 15px;font-size:19px;font-weight:700;line-height:1.32;box-shadow:var(--shadow);margin-bottom:14px}
  .opts{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
  .opt{position:relative;width:100%;text-align:left;padding:12px 12px;border-radius:14px;border:0;color:#fff;font-family:inherit;font-size:17px;font-weight:700;line-height:1.28;
       display:flex;gap:11px;align-items:center;box-shadow:var(--shadow);transition:transform .2s var(--spring),box-shadow .2s,filter .3s}
  .opt.k0{background:var(--c0)} .opt.k1{background:var(--c1)} .opt.k2{background:var(--c2)} .opt.k3{background:var(--c3)}
  .opt:active:not(:disabled){transform:scale(.97)}
  .opt .k{flex:none;width:36px;height:36px;border-radius:10px;background:rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;transition:background .25s,color .25s}
  .opt .t{flex:1}
  .opt .tick{flex:none;width:30px;height:30px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;transform:scale(0) rotate(-90deg);transition:transform .35s var(--spring)}
  .opt .tick svg{width:18px;height:18px}
  .opt.sel{transform:scale(1.02);box-shadow:0 0 0 4px #fff,var(--shadow)}
  .opt.sel .k{background:#fff;color:var(--ink)}
  .opt.sel .tick{transform:none}
  .opt.bump{animation:bump .35s var(--spring)}
  @keyframes bump{40%{transform:scale(1.06)}}
  .opts.picked .opt:not(.sel){filter:saturate(.55) brightness(.85)}
  .opts.locked .opt:not(.sel){filter:saturate(.2) brightness(.55)}
  .msg{text-align:center;font-size:16px;color:var(--soft);font-weight:600;margin-top:8px;min-height:22px}
  .foot{margin-top:auto}

  /* Kết quả */
  .badge{position:relative;width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.25);animation:pop .6s var(--spring) both;animation-delay:var(--d,0ms)}
  .badge.ok{background:var(--ok)} .badge.part{background:var(--c2)} .badge.bad{background:var(--alarm)}
  .badge svg{width:58px;height:58px}
  .badge::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:4px solid #fff;opacity:0;animation:burst .8s ease-out both;animation-delay:calc(var(--d,0ms) + 200ms)}
  @keyframes burst{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(1.7)}}
  .pts{font-size:34px;font-weight:800;color:var(--sun);line-height:1}
  .pts.zero{color:var(--faint)}
  .ans{width:100%;text-align:left;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);font-size:18px;font-weight:700;line-height:1.35;color:#fff}
  .ans small{display:block;font-size:14px;font-weight:700;opacity:.85;margin-bottom:2px}
  .ans.k0{background:var(--c0)} .ans.k1{background:var(--c1)} .ans.k2{background:var(--c2)} .ans.k3{background:var(--c3)}
  .ans.list{background:#fff;color:var(--ink)}
  .ans.list div{display:flex;gap:8px;align-items:flex-start;margin-top:5px}
  .ans.list div b{flex:none;width:24px;height:24px;border-radius:7px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:1px}
  .rank{width:100%;display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.2);border-radius:14px;padding:10px 14px}
  .rank .no{width:46px;height:46px;border-radius:50%;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
  .rank .no.top{background:var(--sun)}
  .rank .lb{text-align:left;font-size:15px;color:var(--soft);font-weight:600;line-height:1.2}
  .rank .lb b{display:block;color:#fff;font-size:19px}
  .rank .sc{margin-left:auto;font-size:22px;font-weight:800}
  .medal{width:150px;height:150px;border-radius:50%;background:var(--sun);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 8px rgba(255,255,255,.25),0 8px 0 8px rgba(0,0,0,.2);animation:pop .7s var(--spring) both;animation-delay:var(--d,0ms)}
  .medal.plain{background:#fff}
  .medal small{font-size:18px;font-weight:700;line-height:1}
  .medal b{font-size:72px;font-weight:800;line-height:.95}
  .confetti{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:4}
  .confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall 2.4s linear both;animation-delay:var(--d,0ms)}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition:none!important}
    .intro,.confetti{display:none}
  }
</style>
</head>
<body>
<div id="app"><div class="center"><p style="color:rgba(255,255,255,.75);font-weight:600">Đang kết nối…</p></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, onValue, set, push } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB8mnryzG6V_ueyEkiFKxDwSSRKcZeYmLw",
  authDomain: "gamemt-70cf3.firebaseapp.com",
  databaseURL: "https://gamemt-70cf3-default-rtdb.firebaseio.com",
  projectId: "gamemt-70cf3",
  storageBucket: "gamemt-70cf3.firebasestorage.app",
  messagingSenderId: "953971410684",
  appId: "1:953971410684:web:9aef16a7341d1435aff979"
};
const db = getDatabase(initializeApp(firebaseConfig));
const ROOT = "cuugio";
const RULE = { mcq:"Chọn đáp án phù hợp nhất và tối ưu thời gian nhất", order:"Chạm theo thứ tự: làm trước → làm sau" };
const INTRO = 2400; // phải khớp với INTRO trong CUUGIO_HOST.html

const $app = document.getElementById("app");
const ls = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}, del:k=>{try{localStorage.removeItem(k)}catch(e){}} };
let pid = ls.get("cuugio_pid"), mySession = ls.get("cuugio_session");
let state = null, players = {}, loaded = { s:false, p:false };
let shownQ = null, shownAt = 0, myOpts = [], picks = [], submitted = false, timeUp = false, timerId = null;
let screenKey = "", screenStart = 0, el = 0;
const D = (ms) => `--d:${ms - el}ms`;

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const shuffle = (a) => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; };
const SVG_TICK = (c="#21124f") => `<svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="${c}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const SVG_X = `<svg viewBox="0 0 24 24" fill="none"><path d="M7 7l10 10M17 7L7 17" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/></svg>`;
const SVG_HALF = `<svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3.2"/></svg>`;
const ALARM = (ring) => `<div class="alarm ${ring ? "ringing" : ""}"><div class="bell l"></div><div class="bell r"></div><div class="face"><div class="hand m"></div><div class="hand"></div><div class="dot"></div></div></div>`;

onValue(ref(db, `${ROOT}/state`), s => { state = s.val() || { phase:"lobby" }; loaded.s = true; render(); });
onValue(ref(db, `${ROOT}/players`), s => { players = s.val() || {}; loaded.p = true; render(); });

function me(){ return pid && players[pid] && String(mySession) === String(state && state.session) ? players[pid] : null; }
function rankOf(){
  const r = Object.entries(players).sort((a,b)=>(b[1].score||0)-(a[1].score||0)||(a[1].ms||0)-(b[1].ms||0));
  return { pos: r.findIndex(([id])=>id===pid)+1, total: r.length };
}
const complete = () => state && state.cur && (state.cur.type === "mcq" ? picks.length === 1 : picks.length === 4);

window.CG = {
  async join(){
    const name = document.getElementById("nm").value.trim().slice(0,20);
    if (!name) { const i = document.getElementById("nm"); i.classList.remove("bump"); void i.offsetWidth; i.style.animation = "shake .4s"; setTimeout(()=>i.style.animation="",400); return; }
    const r = push(ref(db, `${ROOT}/players`));
    pid = r.key; mySession = state.session;
    ls.set("cuugio_pid", pid); ls.set("cuugio_session", mySession);
    await set(r, { name, score:0, ms:0 });
  },
  // Chạm để chọn, chạm lại để đổi. Chưa bấm Gửi đáp án thì chưa nộp.
  tap(k){
    if (submitted || timeUp || !state || state.phase !== "question") return;
    if (performance.now() < shownAt) return;               // còn đang ở màn "Câu n"
    if (state.cur.type === "mcq") picks = picks[0] === k ? [] : [k];
    else { const at = picks.indexOf(k); if (at >= 0) picks.splice(at, 1); else picks.push(k); }
    if (navigator.vibrate) navigator.vibrate(12);
    syncQuestion(k);
  },
  send(){
    if (submitted || timeUp || !complete()) return;
    const ms = Math.round(performance.now() - shownAt);
    if (ms > state.cur.time*1000) return;
    submit(ms);
  }
};
async function submit(ms){
  submitted = true; syncQuestion();
  if (navigator.vibrate) navigator.vibrate(30);
  const a = state.cur.type === "mcq" ? myOpts[picks[0]].id : picks.map(x => myOpts[x].id);
  await set(ref(db, `${ROOT}/answers/${state.q}/${pid}`), { a, ms });
}
function startQuestion(key){
  shownQ = key; shownAt = performance.now() + INTRO; picks = []; submitted = false; timeUp = false;
  myOpts = state.cur.type === "mcq" ? state.cur.options : shuffle(state.cur.options); // trắc nghiệm giữ đúng A B C D như máy chiếu để MC đọc đáp án
  clearInterval(timerId);
  timerId = setInterval(() => {
    if (!state || state.phase !== "question") return clearInterval(timerId);
    const T = state.cur.time*1000, left = Math.max(0, T - Math.max(0, performance.now()-shownAt));
    const mini = document.getElementById("mini");
    if (mini) {
      mini.style.setProperty("--p", (left/T).toFixed(4));
      mini.querySelector("span").textContent = Math.ceil(left/1000);
      mini.classList.toggle("low", left <= 5000 && !submitted);
    }
    if (left <= 0) {
      clearInterval(timerId);
      if (!submitted && complete()) submit(T);  // đã chọn đủ mà quên bấm gửi thì nộp giúp lúc hết giờ
      else if (!submitted) { timeUp = true; syncQuestion(); }
    }
  }, 100);
}

// Cập nhật màn câu hỏi tại chỗ (không vẽ lại) để màu và dấu tích chuyển mượt
function syncQuestion(tapped){
  const box = document.getElementById("opts"); if (!box) return;
  const cur = state.cur;
  box.classList.toggle("locked", submitted || timeUp);
  box.classList.toggle("picked", cur.type === "mcq" && picks.length > 0);
  box.querySelectorAll(".opt").forEach((b, k) => {
    const at = picks.indexOf(k);
    b.classList.toggle("sel", at >= 0);
    b.disabled = submitted || timeUp;
    if (cur.type === "order") b.querySelector(".k").textContent = at >= 0 ? at + 1 : "";
    if (k === tapped) { b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); }
  });
  const btn = document.getElementById("send"), msg = document.getElementById("msg");
  const wasDisabled = btn.disabled;
  btn.disabled = submitted || timeUp || !complete();
  btn.classList.toggle("sent", submitted);
  if (wasDisabled && !btn.disabled) { btn.classList.remove("ready"); void btn.offsetWidth; btn.classList.add("ready"); }
  btn.innerHTML = submitted ? `${SVG_TICK("#fff")}Đã gửi đáp án` : timeUp ? "Hết giờ" : "Gửi đáp án";
  msg.textContent = submitted ? "Nhìn lên màn hình chiếu để xem đáp án."
    : timeUp ? "Bạn chưa kịp gửi đáp án."
    : cur.type === "order" ? (picks.length < 4 ? `Đã xếp ${picks.length}/4 việc. Chạm lại một việc để bỏ chọn.` : "Đã xếp đủ 4 việc. Bấm Gửi đáp án để nộp.")
    : (picks.length ? "Chạm phương án khác nếu muốn đổi." : "");
}

function confetti(at, n){
  const cs = ["#ffd23f","#ffffff","#e5484d","#3e7bfa","#26a65b","#ff9ad5"];
  let h = ""; for (let i=0;i<n;i++) h += `<i style="left:${(i*37+11)%100}%;background:${cs[i%cs.length]};${D(at + (i*53)%800)};animation-duration:${2 + (i%5)*.25}s"></i>`;
  return `<div class="confetti">${h}</div>`;
}
function countUp(id, to, delay){
  const node = document.getElementById(id); if (!node || !to) return;
  const t0 = performance.now() + delay, dur = 800;
  const step = (t) => { const k = Math.min(1, Math.max(0, (t - t0)/dur)); node.textContent = "+" + Math.round(to * (1 - Math.pow(1-k, 3))); if (k < 1) requestAnimationFrame(step); };
  node.textContent = "+0"; requestAnimationFrame(step);
}

const top = (extra="") => `<div class="bgclock"></div><div class="top"><div class="brand">Chuyên đề: Quản lý thời gian</div><div class="sp"></div>${extra}</div>`;

function render(){
  if (!loaded.s || !loaded.p) return;
  if (pid && !me() && (!players[pid] || String(mySession) !== String(state.session))) { pid = null; ls.del("cuugio_pid"); }
  const p = me();
  const ph = state.phase;
  const key = p ? `${state.session}|${ph}|${state.q}` : "join";
  const fresh = key !== screenKey;
  if (fresh) { screenKey = key; screenStart = Date.now(); }
  el = Date.now() - screenStart;

  if (!p) {
    if (!fresh && document.getElementById("nm")) return;   // đang gõ tên thì không vẽ lại
    $app.innerHTML = top() + `<div class="center join">
      <div class="a-pop" style="${D(0)}">${ALARM(true)}</div>
      <h1 class="a-up" style="${D(150)}">Nhập tên để tham gia</h1>
      <p class="a-up" style="${D(230)}">Tên này sẽ hiện trên bảng xếp hạng ở màn hình chiếu.</p>
      <div class="field a-up" style="${D(320)}"><input id="nm" maxlength="20" placeholder="Tên của bạn" autocomplete="off" enterkeyhint="go">
      <button class="btn" onclick="CG.join()">Vào chơi</button></div></div>`;
    document.getElementById("nm").addEventListener("keydown", e => { if (e.key === "Enter") CG.join(); });
    return;
  }
  const nameTag = `<span class="tag">${esc(p.name)}</span>`;
  if (ph === "lobby") {
    $app.innerHTML = top(nameTag) + `<div class="center state">
      <div class="a-pop" style="${D(0)}">${ALARM(false)}</div>
      <h1 class="a-up" style="${D(150)}">Bạn đã vào</h1>
      <div class="chip a-pop" style="${D(260)}">${esc(p.name)}</div>
      <p class="a-up" style="${D(360)}">Câu hỏi đầu tiên sẽ hiện ở đây khi màn hình chiếu bắt đầu.</p></div>`;
    return;
  }
  const cur = state.cur || {};
  const head = `<span class="tag num">Câu ${(state.q??0)+1}/${cur.total||""}</span>`;
  if (ph === "question") {
    if (shownQ !== key) startQuestion(key);
    if (!fresh && document.getElementById("opts")) { syncQuestion(); return; }
    const intro = el < INTRO + 200 ? `<div class="intro" style="${D(0)}">
        <div class="alarm"><div class="bell l"></div><div class="bell r"></div><div class="face"><div class="hand" style="${D(0)}"></div>
        <div class="lbl" style="${D(0)}">Câu</div><div class="big num" style="${D(0)}">${(state.q??0)+1}</div></div></div>
        <div class="kind" style="${D(0)}">${cur.type === "mcq" ? "Trắc nghiệm" : "Xếp thứ tự"}</div></div>` : "";
    const opts = myOpts.map((o,k) => `<button class="opt k${k} a-up" style="${D(INTRO + 350 + k*100)}" onclick="CG.tap(${k})">
        <span class="k">${cur.type === "mcq" ? "ABCD"[k] : ""}</span><span class="t">${esc(o.text)}</span><span class="tick">${SVG_TICK()}</span></button>`).join("");
    $app.innerHTML = top(head) + `<div class="qhead">
        <div class="rule a-drop" style="${D(INTRO)}">${RULE[cur.type]}</div>
        <div class="mini a-pop" id="mini" style="${D(INTRO + 100)}"><div class="pie"></div><span class="num">${cur.time}</span></div></div>
      <div class="prompt a-pop" style="${D(INTRO + 150)}">${esc(cur.prompt)}</div>
      <div class="opts" id="opts">${opts}</div>
      <div class="foot a-up" style="${D(INTRO + 800)}"><button class="btn" id="send" onclick="CG.send()" disabled>Gửi đáp án</button><div class="msg" id="msg"></div></div>` + intro;
    syncQuestion();
    return;
  }
  if (ph === "reveal") {
    clearInterval(timerId);
    const rv = state.rev || {}, last = (p.last && p.last.q === state.q) ? p.last : null;
    const { pos, total } = rankOf();
    const pts = last ? last.pts : 0;
    let kind, icon, title;
    if (!last || !last.answered) { kind = "bad"; icon = SVG_X; title = "Không kịp trả lời"; }
    else if (last.perfect) { kind = "ok"; icon = SVG_TICK("#fff"); title = "Chính xác!"; }
    else if (pts > 0) { kind = "part"; icon = SVG_HALF; title = "Đúng một phần"; }
    else { kind = "bad"; icon = SVG_X; title = "Chưa đúng"; }
    const C = ["var(--c0)","var(--c1)","var(--c2)","var(--c3)"];
    const ans = rv.type === "mcq"
      ? `<div class="ans k${rv.correct} a-up" style="${D(450)}"><small>Đáp án đúng</small>${"ABCD"[rv.correct]}. ${esc(rv.answer)}</div>`
      : `<div class="ans list a-up" style="${D(450)}"><small>Thứ tự đúng</small>${(rv.order||[]).map((t,k)=>`<div><b style="background:${C[k]}">${k+1}</b><span>${esc(t)}</span></div>`).join("")}</div>`;
    $app.innerHTML = top(head) + `<div class="center state">
      <div class="badge ${kind}" style="${D(0)}">${icon}</div>
      <h1 class="a-up" style="${D(150)}">${title}</h1>
      <div class="pts num a-pop ${pts ? "" : "zero"}" style="${D(280)}"><span id="ptsNum">+${pts}</span> điểm</div>
      ${ans}
      <div class="rank a-up" style="${D(600)}"><div class="no num ${pos<=3 ? "top" : ""}">${pos}</div><div class="lb">Hạng của bạn<b class="num">trên ${total} người</b></div><div class="sc num">${p.score||0}</div></div>
    </div>${kind === "ok" ? confetti(300, 28) : ""}`;
    if (fresh) countUp("ptsNum", pts, 300);
    return;
  }
  if (ph === "final") {
    const { pos, total } = rankOf();
    $app.innerHTML = top(nameTag) + `<div class="center state">
      <div class="medal ${pos<=3 ? "" : "plain"}" style="${D(0)}"><small>Hạng</small><b class="num">${pos}</b></div>
      <h1 class="a-up num" style="${D(250)}">Trên ${total} người chơi</h1>
      <div class="pts num a-pop" style="${D(400)}">${p.score||0} điểm</div>
      <p class="a-up" style="${D(550)}">Cảm ơn bạn đã tham gia. Xem bục vinh danh trên màn hình chiếu.</p></div>${pos<=3 ? confetti(300, 40) : ""}`;
  }
}
</script>
</body>
</html>
