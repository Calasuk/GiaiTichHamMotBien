const { useState, useEffect, useMemo, useRef } = React;
const { motion, AnimatePresence } = window.Motion;

const DEFAULT_MAX_TEAMS = 6;
const DEFAULT_ROUNDS = 5;
const LOC = "loc";
const XA = "xa";
const STATES = { WAITING: "waiting", VOTING: "voting", LOCKED: "locked", FINISHED: "finished" };

const choiceLabel = (c) => c === LOC ? "Xử lí nước thải" : c === XA ? "Xả nước thải" : "Không chọn";
const getMaxTeams = (settings) => settings && settings.maxTeams || DEFAULT_MAX_TEAMS;
const getTotalRounds = (settings) => settings && settings.totalRounds || DEFAULT_ROUNDS;

// Chuẩn hóa danh sách Nhóm 1 -> Nhóm maxTeams kèm thống kê cổ đông
function buildTeamsList(maxTeams, teamsData, playersData) {
  const playersArr = Object.entries(playersData || {}).map(([id, p]) => ({ id, ...p }));
  const list = [];
  for (let i = 1; i <= maxTeams; i++) {
    const id = `team_${i}`;
    const tData = teamsData && teamsData[id] || {};
    const groupPlayers = playersArr.filter((p) => p.teamId === id);
    const locVotes = groupPlayers.filter((p) => p.currentChoice === LOC).length;
    const xaVotes = groupPlayers.filter((p) => p.currentChoice === XA).length;
    const votedCount = locVotes + xaVotes;

    let previewChoice = null;
    if (groupPlayers.length > 0) {
      if (locVotes > xaVotes) previewChoice = LOC;else
      previewChoice = XA; // Hòa hoặc 0 phiếu -> Luật lòng tham = XẢ
    }

    list.push({
      id,
      groupNumber: i,
      name: tData.name || `Nhóm ${i}`,
      score: tData.score || 0,
      lastChoice: tData.lastChoice || null,
      lastDelta: tData.lastDelta,
      memberCount: groupPlayers.length,
      votedCount,
      locVotes,
      xaVotes,
      currentChoice: previewChoice
    });
  }
  return list;
}

// Khi vòng đã KHÓA: chỉ dùng phiếu đã chốt (lockedChoices) tại đúng thời điểm khóa.
function applyLockedChoices(playersData, lockedChoices, gameState) {
  if (gameState !== STATES.LOCKED) return playersData || {};
  const lc = lockedChoices || {};
  const out = {};
  Object.entries(playersData || {}).forEach(([pid, p]) => {
    out[pid] = { ...p, currentChoice: lc[pid] || null };
  });
  return out;
}

function useFirebaseReady() {
  const [ready, setReady] = useState(!!window.FB);
  useEffect(() => {
    if (window.FB) {setReady(true);return;}
    const h = () => setReady(true);
    window.addEventListener("fb-ready", h);
    return () => window.removeEventListener("fb-ready", h);
  }, []);
  return ready;
}

function useGame() {
  const [gameState, setGameState] = useState(null);
  const [teams, setTeams] = useState({});
  const [players, setPlayers] = useState({});
  const [dataLoaded, setDataLoaded] = useState(false);
  const [settings, setSettings] = useState(null);
  const [currentRound, setCurrentRound] = useState(0);
  const [lockedChoices, setLockedChoices] = useState({});
  const [error, setError] = useState("");
  useEffect(() => {
    const { db, ref, onValue } = window.FB;
    const onErr = (e) => setError(e.message);
    const u1 = onValue(ref(db, "gameState"), (s) => setGameState(s.val() || STATES.WAITING), onErr);
    const u2 = onValue(ref(db, "teams"), (s) => setTeams(s.val() || {}), onErr);
    const u3 = onValue(ref(db, "players"), (s) => {setPlayers(s.val() || {});setDataLoaded(true);}, onErr);
    const u4 = onValue(ref(db, "settings"), (s) => setSettings(s.val() || {}), onErr);
    const u5 = onValue(ref(db, "currentRound"), (s) => setCurrentRound(s.val() || 0), onErr);
    const u6 = onValue(ref(db, "lockedChoices"), (s) => setLockedChoices(s.val() || {}), onErr);
    return () => {u1();u2();u3();u4();u5();u6();};
  }, []);
  return {
    gameState, teams, players, lockedChoices, dataLoaded, error, currentRound,
    settingsLoaded: settings !== null,
    maxTeams: getMaxTeams(settings),
    totalRounds: getTotalRounds(settings)
  };
}

function RoundSummaryShow({ teamsList, currentRound, onClose, isHost, initialPhase = "loc" }) {
  const [phase, setPhase] = useState(initialPhase);

  const activeTeams = useMemo(() => (teamsList || []).filter((t) => t.memberCount > 0 || t.lastChoice), [teamsList]);
  const locTeams = useMemo(() => activeTeams.filter((t) => t.lastChoice === LOC), [activeTeams]);
  const xaTeams = useMemo(() => activeTeams.filter((t) => t.lastChoice === XA), [activeTeams]);

  const [sortedForBars, setSortedForBars] = useState([]);
  const [applyNewScores, setApplyNewScores] = useState(false);

  const latestTeamsRef = useRef(teamsList || []);
  useEffect(() => {latestTeamsRef.current = teamsList || [];}, [teamsList]);

  const onCloseRef = useRef(onClose);
  useEffect(() => {onCloseRef.current = onClose;}, [onClose]);

  useEffect(() => {
    const currentTeams = latestTeamsRef.current;
    if (initialPhase === "bars") {
      const initialOrder = [...currentTeams].sort((a, b) => (b.score || 0) - (a.score || 0));
      setSortedForBars(initialOrder);
      setApplyNewScores(true);
      return;
    }

    const t1 = setTimeout(() => setPhase("pause"), 2400);
    const t2 = setTimeout(() => setPhase("xa"), 3600);
    const t3 = setTimeout(() => {
      const latest = latestTeamsRef.current;
      const initialOrder = [...latest].sort((a, b) => {
        const prevA = (a.score || 0) - (a.lastDelta || 0);
